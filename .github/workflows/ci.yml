name: NIDS Platform CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Backend & Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy -r requirements.txt

      - name: Run Ruff Code Formatter & Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy app --ignore-missing-imports

  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nids_user
          POSTGRES_PASSWORD: nids_password
          POSTGRES_DB: nids_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx -r requirements.txt

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://nids_user:nids_password@localhost:5432/nids_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
        run: pytest -v

  build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false

      - name: Build React Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
